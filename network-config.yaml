defaultVpc:
  delete: false
  excludeAccounts: []
transitGateways: []
endpointPolicies:
  - name: Default
    document: policies/Default.json
vpcs:
  - name: Test-VPC
    account: Management
    region: us-east-1
    cidrs:
      - 10.0.0.0/16
    subnets:
      - name: Test-Subnet-A
        availabilityZone: a
        routeTable: Test-RouteTable
        ipv4CidrBlock: 10.0.0.0/24
    routeTables:
      - name: Test-RouteTable
        routes: []
    interfaceEndpoints:
      central: false
      defaultPolicy: Default
      subnets:
        - Test-Subnet-A
      endpoints:
        - service: route53
